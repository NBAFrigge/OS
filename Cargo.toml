[package]
name = "OS"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.9.8"
uart_16550 = "0.2.0"
x86_64 = "0.14.2"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"

[package.metadata.bootimage]
test-args = [
  "-device",
  "isa-debug-exit,iobase=0xf4,iosize=0x04",
  "-serial",
  "stdio",
]
run-args = [
  "-serial",
  "stdio",
  "-netdev",
  "user,id=net0,hostfwd=udp::1234-:1234,hostfwd=udp::5000-:5000",
  "-device",
  "e1000,netdev=net0,mac=52:54:00:12:34:56",
  "-object",
  "filter-dump,id=dump0,netdev=net0,file=/tmp/os_net.pcap",
]
test-success-exit-code = 33
